name: yayma
description: "YAYMA - Yet Another Yandex Music App"
version: 2.5.1+1
publish_to: 'none'

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  collection: ^1.19.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  flutter_rust_bridge_hooks: ^2.13.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  m3e_core: ^1.1.3
  material_ui: ^1.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  screen_retriever: ^0.2.2
  signals_flutter: ^7.1.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  webview_all: ^1.4.1
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
#  integration_test:
#    sdk: flutter
  json_serializable: ^6.14.1
  signals_lint: ^7.1.0
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: false
  windows:
    generate: true
    image_path: "assets/icons/logo.webp"
  linux:
    generate: true
    image_path: "assets/icons/logo.webp"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  shaders:
    - shaders/vibe.frag

dependency_overrides:
  image: ^4.9.2
  xml: ^7.0.1

name: yayma
description: "YAYMA - Yet Another Yandex Music App"
version: 2.6.0+1
publish_to: 'none'

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  collection: ^1.19.1
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  flutter_rust_bridge_hooks: ^2.13.0
  freezed_annotation: ^3.1.0
  m3e_core: ^1.1.4
  # Pinned to 0.13.0 by the Flutter SDK.
  material_color_utilities: ^0.13.0
  # 1.8.0 exports RoundedPolygon, which collides with m3e_core's own shapes.
  material_ui: ">=1.7.0 <1.8.0"
  path_provider: ^2.1.6
  # 0.3.0 is incompatible with window_manager 0.5.2 (wants ^0.2.2).
  screen_retriever: ^0.2.2
  signals_flutter: ^7.1.0
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  webview_all: ^1.4.7
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
#  integration_test:
#    sdk: flutter
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: false
  windows:
    generate: true
    image_path: "assets/icons/logo.webp"
  linux:
    generate: true
    image_path: "assets/icons/logo.webp"
  macos:
    generate: true
    image_path: "assets/icons/logo.webp"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  shaders:
    - shaders/vibe.frag

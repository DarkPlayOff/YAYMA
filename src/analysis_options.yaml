include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    lines_longer_than_80_chars: ignore
  exclude:
    - "lib/src/rust/**" # Ignore auto-generated Rust bridge code
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Disable mandatory documentation for every method (redundant for an app)
    public_member_api_docs: false
    
    # Sorting constructors first is a matter of taste, disabling for flexibility
    sort_constructors_first: false

    # Allow using print (though a logger is better in production)
    avoid_print: false

    # Prefer single quotes, but strict lints sometimes require double quotes
    prefer_single_quotes: true
    
    # Don't require explicit types where they are inferred (Dart 3+ handles this well)
    always_specify_types: false

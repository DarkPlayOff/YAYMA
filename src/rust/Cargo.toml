[package]
name = "yayma"
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[lib]
name = "yayma"
crate-type = ["cdylib", "staticlib"]

[dependencies]

# Core 
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "brotli",
  "json",
  "http2",
  "multipart",
  "query",
] }

# Audio
symphonia = { version = "0.5.5", default-features = false}
# `symphonia-wav` exists only so the seek tests can build a WAV fixture in
# memory; the app never streams WAV (SUPPORTED_TRACK_EXTS has no entry).
rodio = { version = "0.23.0", default-features = false, features = [
  "playback",
  "symphonia-flac",
  "symphonia-aac",
  "symphonia-mp3",
  "symphonia-isomp4",
  "symphonia-simd",
  "symphonia-wav",
  "symphonia-pcm",
  "tracing",
  "crossbeam-channel",
] }

yandex-music = "0.7.0"
chrono = { version = "0.4.45", features = ["serde"] }
flutter_rust_bridge = { version = "=2.13.0" }
serde = { version = "1.0.229", features = ["derive"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0.0"

# Utilities
flume = { version = "0.12.0", default-features = false, features = ["async"] }
fastrand = "2.5.0"
crossbeam-channel = "0.5.17"
thiserror = "2.0.21"
futures = "0.3.34"
serde_json = "1.0.154"

im = "15.1.0"
arc-swap = "1.9.5"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }


parking_lot = "0.13"
foldhash = "0.2.0"
urlencoding = "2.1.3"
lofty = "0.25.1"
bytes = "1.12.1"
regex = "1.13.1"
quick-xml = "0.42.0"
[target.'cfg(not(target_os = "android"))'.dependencies]
discord-rich-presence = "1.1.0"
wayclip-global-hotkey = "0.7"
souvlaki = "0.9.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
] }

# Same alsa crate cpal already links on Linux; referenced directly to probe
# what ALSA 'default' actually resolves to (see audio::util).
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = { version = "0.7.1", features = ["jni"] }
jni = "0.22"
ndk-context = "0.1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
strip = "symbols"

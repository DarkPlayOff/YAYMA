name: Build Release

on:
  workflow_dispatch:
  workflow_call:

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Init
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libasound2-dev libkeybinder-3.0-dev curl git unzip clang lld libclang-dev llvm-dev libayatana-appindicator3-dev libdbus-1-dev

      - name: Setup Rust
        # Same version as src/rust/rust-toolchain.toml, otherwise the FRB hook
        # downloads a second toolchain on every run.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rust"

      - name: Cache Rust Target
        uses: actions/cache@v4
        with:
          # Cargo writes to the FRB native-assets build dir, not src/rust/target.
          path: |
            src/.dart_tool/hooks_runner/*/*/target
            ${{ runner.temp }}/frb_native_assets_*
          key: ${{ runner.os }}-linux-target-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-linux-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Restore Bridge
        uses: ./.github/actions/restore-bridge

      - name: Build
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build linux --release

      - name: Archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" == "$GITHUB_REF" ]; then VERSION="manual"; fi
          tar -czvf yayma-linux-x64-${VERSION}.tar.gz -C src/build/linux/x64/release/bundle/ .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          # Artifacts are already compressed (apk/zip/dmg/tar.gz); re-gzipping costs minutes.
          compression-level: 0
          name: linux_x64_release
          path: yayma-linux-*.tar.gz

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C linker=lld-link.exe
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        # Same version as src/rust/rust-toolchain.toml, otherwise the FRB hook
        # downloads a second toolchain on every run.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rust"

      - name: Cache Rust Target
        uses: actions/cache@v4
        with:
          # Cargo writes to the FRB native-assets build dir, not src/rust/target.
          path: |
            src/.dart_tool/hooks_runner/*/*/target
            ${{ runner.temp }}/frb_native_assets_*
          key: ${{ runner.os }}-windows-target-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-windows-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Restore Bridge
        uses: ./.github/actions/restore-bridge

      - name: Build
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build windows --release
        shell: powershell

      - name: Archive
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          if ($VERSION -eq $env:GITHUB_REF) { $VERSION = "manual" }
          "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $zip = Join-Path $env:GITHUB_WORKSPACE "yayma-windows-x64-$VERSION.zip"
          $sevenZip = @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZip) { throw "7-Zip not found on runner" }
          Push-Location "src\build\windows\x64\runner\Release"
          # 7z is multi-threaded; Compress-Archive is single-threaded and takes minutes here.
          # No file args = add everything from the current dir, stored at archive root.
          & $sevenZip a -tzip -mx=5 $zip
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit 1 }
        shell: powershell

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          # Artifacts are already compressed (apk/zip/dmg/tar.gz); re-gzipping costs minutes.
          compression-level: 0
          name: windows_x64_release
          path: yayma-windows-*.zip

      - name: Build Installer
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\yayma.iss"
        shell: powershell

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          # Artifacts are already compressed (apk/zip/dmg/tar.gz); re-gzipping costs minutes.
          compression-level: 0
          name: windows_x64_installer
          path: dist\yayma-windows-setup-*.exe

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Init
        run: |
          sudo apt-get update
          # Android target builds no desktop GUI/audio crates: those are cfg-gated out in src/rust/Cargo.toml.
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl git unzip clang lld libclang-dev llvm-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rust"

      - name: Cache Rust Target
        uses: actions/cache@v4
        with:
          # Cargo writes to the FRB native-assets build dir, not src/rust/target.
          path: |
            src/.dart_tool/hooks_runner/*/*/target
            ${{ runner.temp }}/frb_native_assets_*
          key: ${{ runner.os }}-android-target-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android Signing
        working-directory: ./src/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v}" ]; then present=$((present + 1)); else missing=$((missing + 1)); fi
          done

          if [ "$present" -eq 4 ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.keystore"
            } > key.properties
            echo "SIGN_SUFFIX=" >> "$GITHUB_ENV"
          elif [ "$missing" -eq 4 ]; then
            echo "No release signing secrets found; falling back to debug signing"
            echo "SIGN_SUFFIX=-dsign" >> "$GITHUB_ENV"
          else
            echo "::error::Incomplete Android signing secrets: need all of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD set together, or none of them."
            exit 1
          fi

      - name: Restore Bridge
        uses: ./.github/actions/restore-bridge

      - name: Build
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" == "$GITHUB_REF" ]; then VERSION="manual"; fi
          mkdir -p android_artifacts
          for apk in src/build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$apk" "android_artifacts/yayma-android-${abi}-${VERSION}${SIGN_SUFFIX}.apk"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          # Artifacts are already compressed (apk/zip/dmg/tar.gz); re-gzipping costs minutes.
          compression-level: 0
          name: android_release
          path: android_artifacts/yayma-android-*.apk

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        # Same version as src/rust/rust-toolchain.toml, otherwise the FRB hook
        # downloads a second toolchain on every run.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rust"

      - name: Cache Rust Target
        uses: actions/cache@v4
        with:
          # Cargo writes to the FRB native-assets build dir, not src/rust/target.
          path: |
            src/.dart_tool/hooks_runner/*/*/target
            ${{ runner.temp }}/frb_native_assets_*
          key: ${{ runner.os }}-macos-target-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-macos-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Restore Bridge
        uses: ./.github/actions/restore-bridge

      - name: Build
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release

      - name: Archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" == "$GITHUB_REF" ]; then VERSION="manual"; fi
          APP="src/build/macos/Build/Products/Release/yayma.app"
          test -d "$APP"
          hdiutil create -volname "YAYMA" -srcfolder "$APP" -ov -format UDZO "yayma-macos-arm64-${VERSION}.dmg"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          # Artifacts are already compressed (apk/zip/dmg/tar.gz); re-gzipping costs minutes.
          compression-level: 0
          name: macos_arm64_release
          path: yayma-macos-*.dmg

name: Debug Build

on:
  workflow_dispatch:

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-linux-debug:
    needs: generate-bridge
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Bridge
        uses: actions/download-artifact@v4
        with:
          name: frb-bridge
          path: ${{ github.workspace }}

      - name: System Init
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libasound2-dev curl git unzip clang lld libclang-dev llvm-dev libayatana-appindicator3-dev libdbus-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rust -> src/target"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build linux --debug

      - name: Archive
        run: |
          tar -czvf linux_debug.tar.gz -C src/build/linux/x64/debug/bundle/ .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux_debug_tar
          path: linux_debug.tar.gz

  build-windows-debug:
    needs: generate-bridge
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C linker=lld-link.exe
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Bridge
        uses: actions/download-artifact@v4
        with:
          name: frb-bridge
          path: ${{ github.workspace }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rust -> src/target"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build windows --debug
        shell: powershell

      - name: Archive
        run: |
          Compress-Archive -Path "src\build\windows\x64\runner\Debug\*" -DestinationPath "windows_debug.zip"
        shell: powershell

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows_debug_zip
          path: windows_debug.zip
